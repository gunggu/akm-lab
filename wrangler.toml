name = "lease-lab"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Preserve the live textbook hostname while routing only LeaseLab paths.
[[routes]]
pattern = "akm.gunggu.my.id/lease-lab"
zone_name = "gunggu.my.id"

[[routes]]
pattern = "akm.gunggu.my.id/lease-lab/*"
zone_name = "gunggu.my.id"

[[d1_databases]]
binding = "DB"
database_name = "session10-lease-lab"
database_id = "22e624d7-aefd-4fbf-a5a7-26a670b351ba"
